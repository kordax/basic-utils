{{ $projectName := "basic-utils" }}

project: {{ $projectName }}
configVersion: 1
---

image: ci-tools
from: registry.casinomodule.org/casino27/ci-tools:go-tools-go1.27.0
fromCacheVersion: "go-tools-build-base-v1{{- if eq (env "NOCACHE") "true" }}-{{ env "CI_JOB_STARTED_AT" }}{{- end }}"
imageSpec:
  config:
    workingDir: /app
shell:
  beforeSetup:
    - mkdir -p /root/.ssh && echo -e 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null' > /root/.ssh/config
git:
  - add: /
    to: /app
    stageDependencies:
      beforeSetup:
        - "**/*"
---
image: builder
final: false
from: golang:1.27-alpine
{{- if eq (env "NOCACHE") "true" }}
fromCacheVersion: "{{ env "CI_JOB_STARTED_AT" }}"
{{- end }}
imageSpec:
  config:
    workingDir: /app
shell:
  beforeInstall:
    - apk --no-cache add git openssh-client
    - mkdir -p /root/.ssh && echo -e 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null' > /root/.ssh/config
  install:
    - cd /app
    - go env -w GOPRIVATE=git.casinomodule.org
    - go mod download
  beforeSetup:
    - cd /app
    - go test -run '^$' ./...
git:
  - add: /
    to: /app
    stageDependencies:
      install:
        - "go.mod"
        - "go.sum"
      beforeSetup:
        - "**/*.go"
---
